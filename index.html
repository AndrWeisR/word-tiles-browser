<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Word Tiles</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --panel: #e2e8f0;
      --accent: #e53e3e;
      --gold: #d97706;
      --teal: #0891b2;
      --green: #38a169;
      --text: #1a202c;
      --muted: #64748b;
      --tile-bg: #ffffff;
      --tile-border: #cbd5e1;
      --radius: 10px;
      /* Overridden by applyLayout() on load for Android compatibility */
      --tile-size: 56px;
      --gap: 5px;
      --font-tile: 1.9rem;
      --font-ui: 0.8rem;
      --font-label: 11px;
      --font-btn: 18px;
      --btn-pad: 16px 20px;
      --font-word: 32px;
      --font-pts: 12px;
      --word-height: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px 4px 12px;
      user-select: none;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--text);
      margin-bottom: 12px;
    }
    h1 span { color: var(--accent); }

    /* Shared width = board width, so everything lines up */
    .hud, .word-row, .actions {
      width: calc(var(--tile-size) * 5 + var(--gap) * 4 + 20px);
    }

    /* HUD */
    .hud { display: flex; gap: var(--gap); margin-bottom: 8px; }
    .hud-box {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--tile-border);
      border-radius: var(--radius);
      padding: 6px 8px;
      text-align: center;
    }
    .hud-label {
      font-size: var(--font-label);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .hud-value { font-size: var(--font-ui); font-weight: 500; color: var(--text); }
    .hud-value.gold { color: var(--gold); }
    .hud-value.teal { color: var(--teal); }

    /* Word being built. Fixed height so the grid never jumps as letters are added. */
    /* Word bar + backspace button sit side by side; together they span the board width. */
    .word-row { display: flex; gap: var(--gap); margin-bottom: 8px; }
    .word-wrap {
      flex: 1;
      min-width: 0;                /* lets the bar shrink so the text-fitting code can size to it */
      height: var(--word-height);
      background: var(--surface);
      border: 2px solid var(--tile-border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border-color 0.15s, background 0.15s;
    }
    .word-wrap.building { border-color: var(--accent); background: rgba(229,62,62,0.06); }
    .word-wrap.valid    { border-color: var(--green);  background: rgba(56,161,105,0.10); }

    .word-text {
      font-size: var(--font-word);
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--muted);
      white-space: nowrap;
    }
    .word-wrap.building .word-text { color: var(--accent); }
    .word-wrap.valid .word-text    { color: var(--green); }
    .word-placeholder { letter-spacing: 0.04em; font-weight: 400; }

    /* Board */
    .board-wrap {
      background: var(--surface);
      border: 1px solid var(--tile-border);
      border-radius: 14px;
      padding: 8px;
      margin-bottom: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(5, var(--tile-size));
      grid-template-rows: repeat(5, var(--tile-size));
      gap: var(--gap);
    }
    .cell { width: var(--tile-size); height: var(--tile-size); position: relative; }

    .tile {
      width: var(--tile-size);
      height: var(--tile-size);
      border-radius: 8px;
      background: var(--tile-bg);
      border: 2px solid var(--tile-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-tile);
      font-weight: 500;
      cursor: pointer;
      position: absolute;
      top: 0; left: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.10);
      transition: border-color 0.12s, background 0.12s, box-shadow 0.12s;
    }

    .tile .ltr { line-height: 1; transform: translateY(-6%); }   /* lift a little so the corner value has room */
    /* Scrabble-style value, small, bottom-right corner */
    .tile .pts {
      position: absolute;
      right: 7%;
      bottom: 5%;
      font-size: var(--font-pts);
      font-weight: 500;
      line-height: 1;
      color: var(--muted);
      pointer-events: none;
    }
    .tile.selected .pts { color: inherit; opacity: 0.85; }

    /* Selected = red while the word is not (yet) valid ... */
    .tile.selected {
      border-color: var(--accent);
      background: rgba(229,62,62,0.12);
      color: var(--accent);
      font-weight: 700;
      box-shadow: 0 0 12px rgba(229,62,62,0.25);
      z-index: 2;
    }
    /* ... and green as soon as the whole selection spells a valid word. */
    .word-ready .tile.selected {
      border-color: var(--green);
      background: rgba(56,161,105,0.12);
      color: var(--green);
      box-shadow: 0 0 12px rgba(56,161,105,0.25);
    }

    .tile.fresh { animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes popIn {
      from { transform: scale(0.4); opacity: 0.3; }
      to   { transform: scale(1);   opacity: 1; }
    }

    /* Action buttons */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
      margin-bottom: 8px;
    }

    .btn-finish {
      grid-column: 1 / -1;
    }

    .actions button {
      width: 100%;
      box-sizing: border-box;
    }

    button {
      font-family: sans-serif, monospace;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      font-size: var(--font-btn);
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: var(--btn-pad);
      transition: all 0.15s;
    }
    .btn-confirm { background: var(--teal); color: #ffffff; font-weight: 500; flex: 1; }
    .btn-confirm:disabled { background: rgba(8,145,178,0.18); color: var(--muted); cursor: not-allowed; }
    /* Backspace: tap = delete last letter, press-and-hold = clear the word. Uses aria-disabled
       rather than the disabled attribute so a press that empties the word (and so greys the
       button out) is never interrupted by the browser's disabled-control handling. */
    .btn-back {
      flex: 0 0 auto;
      width: calc(var(--word-height) * 1.1);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--tile-border);
      border-radius: var(--radius);
      -webkit-touch-callout: none;
      /* The press is tracked in JS. Without this the browser turns a drifting finger into a
         pan and cancels the press after a few pixels, which a trembling hand would trigger. */
      touch-action: none;
    }
    .btn-back svg {
      width: calc(var(--word-height) * 0.46);
      height: calc(var(--word-height) * 0.46);
      pointer-events: none;
    }
    .btn-back:active { background: var(--panel); }
    .btn-back[aria-disabled="true"] { color: var(--muted); opacity: 0.45; cursor: default; }
    .btn-back[aria-disabled="true"]:active { background: var(--surface); }
    .btn-finish {
      width: calc(var(--tile-size) * 5 + var(--gap) * 4 + 20px);
      background: var(--surface);
      color: var(--accent);
      border: 2px solid var(--accent);
      font-weight: 500;
    }

    /* Game over overlay */
    .gameover-overlay {
      position: fixed; inset: 0;
      background: rgba(26,32,44,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 20;
    }
    .gameover-overlay.hidden { display: none; }
    .gameover-card {
      width: calc(var(--tile-size) * 5 + var(--gap) * 4 + 20px);
      background: #fff;
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .gameover-title { font-family: 'Fraunces', serif; font-size: calc(var(--font-btn) * 1.5); color: var(--accent); }
    .gameover-label { font-size: var(--font-label); letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .gameover-score { font-size: calc(var(--font-btn) * 2.2); color: var(--gold); font-weight: 600; line-height: 1.1; }
    .gameover-best  { font-size: var(--font-btn); color: var(--muted); }
    .gameover-newbest {
      font-size: var(--font-btn); font-weight: 700; color: var(--gold);
      background: #fef3c7; border: 1px solid rgba(217,119,6,0.35);
      border-radius: 8px; padding: 8px 12px;
    }
    .gameover-newbest.hidden { display: none; }
    .btn-gameover { background: var(--accent); color: #fff; letter-spacing: 2px; width: 100%; margin-top: 4px; }

    /* Level-up dialog: an in-page "alert" with one OK button. The backdrop swallows every tap,
       so nothing behind it can be played until the player presses OK. */
    .levelup-overlay {
      position: fixed; inset: 0;
      background: rgba(26,32,44,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 30;
    }
    .levelup-overlay.hidden { display: none; }
    .levelup-card {
      width: calc(var(--tile-size) * 5 + var(--gap) * 4 + 20px);
      max-width: 94vw;
      background: #fff;
      border: 2px solid var(--teal);
      border-radius: 14px;
      padding: 22px 18px 18px;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .levelup-title { font-family: 'Fraunces', serif; font-size: calc(var(--font-btn) * 1.5); font-weight: 700; color: var(--gold); }
    .levelup-msg { font-size: calc(var(--font-btn) * 1.2); line-height: 1.4; color: var(--text); overflow-wrap: anywhere; }
    .btn-levelup { background: var(--teal); color: #fff; letter-spacing: 2px; width: 100%; margin-top: 4px; }

    .btn-hint {
      background: var(--surface);
      color: var(--gold);
      border: 2px solid var(--gold);
      font-weight: 500;
    }
    .btn-hint:disabled { color: var(--muted); border-color: var(--tile-border); cursor: not-allowed; }

    /* Hint-confirm dialog: same visual language as the level-up dialog, but with two buttons
       (Yes / No) side by side instead of one OK. */
    .hintconfirm-overlay {
      position: fixed; inset: 0;
      background: rgba(26,32,44,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 30;
    }
    .hintconfirm-overlay.hidden { display: none; }
    .hintconfirm-card {
      width: calc(var(--tile-size) * 5 + var(--gap) * 4 + 20px);
      max-width: 94vw;
      background: #fff;
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 22px 18px 18px;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .hintconfirm-title { font-family: 'Fraunces', serif; font-size: calc(var(--font-btn) * 1.5); font-weight: 700; color: var(--gold); }
    .hintconfirm-msg { font-size: calc(var(--font-btn) * 1.2); line-height: 1.4; color: var(--text); overflow-wrap: anywhere; }
    .hintconfirm-buttons { display: flex; gap: var(--gap); width: 100%; margin-top: 4px; }
    .btn-hintconfirm-yes, .btn-hintconfirm-no { flex: 1; letter-spacing: 2px; }
    .btn-hintconfirm-yes { background: var(--gold); color: #fff; }
    .btn-hintconfirm-no  { background: var(--surface); color: var(--muted); border: 1px solid var(--tile-border); }

    /* "No word left" info dialog: same shape as the level-up OK dialog. Shown instead of the
       hint-confirm dialog when nothing can be found at all, so the player is never asked to
       spend points on a hint that would fail to reveal anything. */
    .nohint-overlay {
      position: fixed; inset: 0;
      background: rgba(26,32,44,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 30;
    }
    .nohint-overlay.hidden { display: none; }
    .nohint-card {
      width: calc(var(--tile-size) * 5 + var(--gap) * 4 + 20px);
      max-width: 94vw;
      background: #fff;
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 22px 18px 18px;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .nohint-title { font-family: 'Fraunces', serif; font-size: calc(var(--font-btn) * 1.5); font-weight: 700; color: var(--accent); }
    .nohint-msg { font-size: calc(var(--font-btn) * 1.2); line-height: 1.4; color: var(--text); overflow-wrap: anywhere; }
    .btn-nohint { background: var(--accent); color: #fff; letter-spacing: 2px; width: 100%; margin-top: 4px; }

    /* Loading / error message */
    .status-msg { margin: 40px 20px; text-align: center; font-size: var(--font-btn); color: var(--muted); }
    .status-msg.error { color: var(--accent); }

    /* Toast */
    .toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(135px);
      background: var(--teal); color: #ffffff;
      border-radius: 12px; padding: var(--btn-pad);
      font-size: var(--font-btn); font-weight: 700; letter-spacing: 1px;
      transition: transform 0.25s ease;
      z-index: 50; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(8,145,178,0.35);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<h1>Word<span>Tiles</span></h1>

<div class="hud">
  <div class="hud-box"><div class="hud-label">Score</div><div class="hud-value gold" id="score">0</div></div>
  <div class="hud-box"><div class="hud-label">Level</div><div class="hud-value" id="level">1</div></div>
  <div class="hud-box"><div class="hud-label">Best</div><div class="hud-value gold" id="highscore">0</div></div>
  <div class="hud-box" id="btn-new-game-hud" style="cursor: pointer;">
    <div class="hud-label">Game</div><div class="hud-value teal">New</div>
  </div>
</div>

<div class="word-row">
  <div class="word-wrap" id="word-wrap"><div class="word-text" id="word-text"></div></div>
  <button class="btn-back" id="btn-back" type="button" aria-disabled="true"
          aria-label="Backspace. Tap to delete the last letter, press and hold to clear the word.">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="20" y1="12" x2="4" y2="12"/><polyline points="11 5 4 12 11 19"/>
    </svg>
  </button>
</div>

<div class="board-wrap"><div class="board" id="board"></div></div>

<div class="actions">
  <button class="btn-hint" id="btn-hint" type="button">Hint</button>
  <button class="btn-confirm" id="btn-confirm" disabled>Submit</button>
  <button class="btn-finish" id="btn-finish">Finish game</button>
</div>

<div class="gameover-overlay hidden" id="gameover">
  <div class="gameover-card">
    <div class="gameover-title">Game Over</div>
    <div class="gameover-label">Your score</div>
    <div class="gameover-score" id="go-score">0</div>
    <div class="gameover-newbest hidden" id="go-newbest">&#127942; New best score!</div>
    <div class="gameover-best" id="go-best">Best: 0</div>
    <button class="btn-gameover" id="btn-gameover">New Game</button>
  </div>
</div>

<div class="hintconfirm-overlay hidden" id="hintconfirm" role="alertdialog" aria-modal="true"
     aria-labelledby="hintconfirm-title" aria-describedby="hintconfirm-msg">
  <div class="hintconfirm-card">
    <div class="hintconfirm-title">Use a hint?</div>
    <div class="hintconfirm-msg" id="hintconfirm-msg">Spend 50 points for a hint?</div>
    <div class="hintconfirm-buttons">
      <button class="btn-hintconfirm-no" id="btn-hintconfirm-no" type="button">No</button>
      <button class="btn-hintconfirm-yes" id="btn-hintconfirm-yes" type="button">Yes</button>
    </div>
  </div>
</div>

<div class="nohint-overlay hidden" id="nohint" role="alertdialog" aria-modal="true"
     aria-labelledby="nohint-title" aria-describedby="nohint-msg">
  <div class="nohint-card">
    <div class="nohint-title">No hint available</div>
    <div class="nohint-msg" id="nohint-msg">No words can be found!</div>
    <button class="btn-nohint" id="btn-nohint" type="button">OK</button>
  </div>
</div>

<div class="levelup-overlay hidden" id="levelup" role="alertdialog" aria-modal="true"
     aria-labelledby="levelup-title" aria-describedby="levelup-msg">
  <div class="levelup-card">
    <div class="levelup-title" id="levelup-title">Level up!</div>
    <div class="levelup-msg" id="levelup-msg"></div>
    <button class="btn-levelup" id="btn-levelup" type="button">OK</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ═══ Game logic (identical to test/logic.js, which is unit-tested in Node) ═══
  // Pure game logic for Word Tiles. No DOM access, so it can be unit-tested in Node
  // and pasted verbatim into wordtiles.html.
  //
  // State shape (all JSON-serialisable so it can go straight into localStorage):
  //   board:   25 entries, each a single letter 'A'..'Z' (or null while a refill is pending)
  //   bank:    array of letters waiting to enter the grid (leftovers from long seed words)
  //   score:   integer
  //   words:   number of valid words submitted so far (drives the level)
  //   selection: array of board indices (0..24) in tap order

  const CELLS = 25;
  const MIN_SUBMIT_FLOOR = 4;    // shortest word any level ever accepts (level 1)
  const MIN_SUBMIT_CEIL = 10;    // highest minimum a level can demand (matches the 10-letter seed ceiling)
  const MAX_WORD_LENGTH = CELLS;
  const WORDS_PER_LEVEL = 20;
  const MAX_HINT_LENGTH = 4;

  // ── Letter values (standard Scrabble) ────────────────────────────────────────
  const LETTER_VALUES = {
    A: 1, E: 1, I: 1, O: 1, U: 1, L: 1, N: 1, S: 1, T: 1, R: 1,
    D: 2, G: 2,
    B: 3, C: 3, M: 3, P: 3,
    F: 4, H: 4, V: 4, W: 4, Y: 4,
    K: 5,
    J: 8, X: 8,
    Q: 10, Z: 10,
  };

  function wordValue(word) {
    let n = 0;
    for (const ch of word) n += LETTER_VALUES[ch];
    return n;
  }

  // ── Levels ───────────────────────────────────────────────────────────────────
  function levelFor(words) {
    // return 8; // Uncomment this to test a specific level.
    return Math.floor(words / WORDS_PER_LEVEL) + 1;
  }

  // The shortest word the player may submit, for a given level. Rises by one letter per
  // level starting at 4 (level 1)
  function minSubmitFor(level) {
    return MIN_SUBMIT_FLOOR - 1 + level;
  }

  // Range of lengths for seed words.
  // Level 1: 4-6, 2: 4-7, 3: 4-8, 4: 4-9, 5: 4-10, then the minimum rises:
  // 6: 5-10, 7: 6-11, 8: 7-12, 9: 8-13...
  function lengthRange(level) {
    if (level <= 5) return { min: 4, max: 5 + level };      // 1->6 ... 5->10
    const min = Math.min(MAX_WORD_LENGTH, 4 + (level - 5)); // 6->5 ... 10->9, 11+->10
    return { min, max: level + 5 };
  }

  // ── Dictionaries ─────────────────────────────────────────────────────────────
  // Two separate word lists are used:
  //   - the SEED dictionary (the original "simple" word list) supplies the words used to
  //     refill the grid, via byLength.
  //   - the VALID dictionary (a much larger word list) decides what the player is allowed
  //     to submit, via set. Because it is only ever looked up by exact word, it does not
  //     need byLength, which is skipped to save memory (it would hold ~200,000 short strings
  //     otherwise).
  // Words shorter than MIN_SUBMIT_FLOOR are dropped from both: they can never be submitted
  // (see minSubmitFor) and must never be used as seeds.
  //
  // Builds { set, byLength } from the raw text. Pass includeByLength=false for a
  // validation-only dictionary, to skip building the (unused) byLength index.
  function buildDictionary(rawText, includeByLength = true) {
    const set = new Set();
    const byLength = includeByLength ? {} : null;
    for (let line of rawText.split('\n')) {
      const w = line.trim().toUpperCase();
      if (w.length < MIN_SUBMIT_FLOOR) continue;
      if (!/^[A-Z]+$/.test(w)) continue;
      if (set.has(w)) continue;
      set.add(w);
      if (includeByLength) (byLength[w.length] = byLength[w.length] || []).push(w);
    }
    return { set, byLength };
  }

  // Uniform over *words* in the level's length range (as agreed). To change to
  // "pick a length first, then a word", replace the body of this function only.
  // seedDict must have been built with includeByLength=true (the default).
  function pickSeed(seedDict, level, rng = Math.random) {
    const { min, max } = lengthRange(level);
    let total = 0;
    for (let n = min; n <= max; n++) total += (seedDict.byLength[n] || []).length;
    let k = Math.floor(rng() * total);
    for (let n = min; n <= max; n++) {
      const list = seedDict.byLength[n] || [];
      if (k < list.length) {
        // console.log('Seed = ' + list[k]);
        return list[k];
      }
      k -= list.length;
    }
    throw new Error('No words available for level ' + level);
  }

  // ── Refill ───────────────────────────────────────────────────────────────────
  // Takes `need` letters for the empty cells. Draws from the bank first, in order.
  // When the bank is empty, picks a fresh seed word: the first `need` letters (in seed
  // order) go to the grid and any remainder is appended to the bank. If the seed is
  // shorter than what is still needed, the loop simply picks another seed, so the grid is
  // always completely filled.
  function drawLetters(state, need, seedDict, level, rng = Math.random) {
    const out = [];
    while (out.length < need) {
      if (state.bank.length === 0) {
        const seed = pickSeed(seedDict, level, rng);
        state.bank.push(...seed.split(''));
      }
      out.push(state.bank.shift());
    }
    return out;
  }

  // Places `letters` into the empty cells. The letters arrive in seed order but land in
  // the vacated positions in random order, so a word's letters are not adjacent in
  // reading order.
  function fillEmptyCells(state, letters, rng = Math.random) {
    const empty = [];
    for (let i = 0; i < CELLS; i++) if (state.board[i] === null) empty.push(i);
    if (empty.length !== letters.length) {
      throw new Error(`fill mismatch: ${empty.length} empty, ${letters.length} letters`);
    }
    // Fisher-Yates shuffle of the letters
    const ls = letters.slice();
    for (let i = ls.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [ls[i], ls[j]] = [ls[j], ls[i]];
    }
    empty.forEach((cell, n) => { state.board[cell] = ls[n]; });
  }

  // ── New game ─────────────────────────────────────────────────────────────────
  function newState(seedDict, rng = Math.random) {
    const state = { board: new Array(CELLS).fill(null), bank: [], score: 0, words: 0, selection: [] };
    fillEmptyCells(state, drawLetters(state, CELLS, seedDict, 1, rng), rng);
    return state;
  }

  // ── Selection helpers ────────────────────────────────────────────────────────
  function selectedWord(state) {
    return state.selection.map(i => state.board[i]).join('');
  }

  function isValidWord(state, validDict) {
    const w = selectedWord(state);
    return w.length >= minSubmitFor(levelFor(state.words)) && validDict.set.has(w);
  }

  // Tapping a tile that is not yet in the word appends it. Tapping a tile that IS already in
  // the word does nothing: the player cannot deselect tiles directly. Letters come off only
  // via backspace (last letter) or clearSelection (whole word), so a word is always built and
  // unbuilt strictly in order. Returns true if the selection changed.
  function selectTile(state, index) {
    if (!Number.isInteger(index) || index < 0 || index >= CELLS) return false;
    if (state.selection.includes(index)) return false;
    state.selection.push(index);
    return true;
  }

  // Removes the last letter (deselecting its tile). Returns true if the selection changed.
  function backspace(state) {
    if (state.selection.length === 0) return false;
    state.selection.pop();
    return true;
  }

  // Removes the whole word (deselecting every tile). Returns true if the selection changed.
  function clearSelection(state) {
    if (state.selection.length === 0) return false;
    state.selection = [];
    return true;
  }

  // ── Submit ───────────────────────────────────────────────────────────────────
  // Returns the points awarded, or 0 if the selection is not a valid word.
  // Points = sum of the letter values. The refill count is the number of TILES removed,
  // which is a different number, so the two must never be confused.
  function submitWord(state, seedDict, validDict, rng = Math.random) {
    if (!isValidWord(state, validDict)) return 0;
    const removed = state.selection.length;
    const points = wordValue(selectedWord(state));
    for (const i of state.selection) state.board[i] = null;
    state.selection = [];
    state.score += points;
    state.words += 1;
    // The level is taken from the word count *after* this word, so the new seed for the
    // refill already reflects a level-up. The bank drains first, so the change only shows
    // up once the bank is empty (seamless, as agreed).
    const level = levelFor(state.words);
    fillEmptyCells(state, drawLetters(state, removed, seedDict, level, rng), rng);
    return points;
  }

  // ── Level-up notice ──────────────────────────────────────────────────────────
  // Given the number of words submitted before and after a submit, returns the text to show
  // the player if that submit moved them up a level, or null if the level did not change.
  // The minimum shown is the one now in force (see minSubmitFor), so it is always the rule
  // the player is about to play under. It is never below 5 (level 1, the only level with a
  // minimum of 4, cannot be "reached" by levelling up), so "letters" is always plural.
  function levelUpMessage(wordsBefore, wordsAfter) {
    const after = levelFor(wordsAfter);
    if (after <= levelFor(wordsBefore)) return null;
    return "You're now on level " + after + " and need to use at least " + minSubmitFor(after) + " letters!";
  }

  // ── "Any word left?" check ──────────────────────────────────────────────────
  // Used only when the player presses Finish Game, to warn them if a word is still there to
  // find. Checks whether ANY word in seedDict (the small "simple" list, as requested) of at
  // least minLen letters can be formed from the board's 25 letters as a multiset -- i.e. each
  // board letter can be used by at most one word-letter, with no regard to position, matching
  // how words are actually built in this game (tiles can be tapped in any order). Returns true
  // as soon as one is found, so it does not need to scan the whole dictionary in the typical
  // case where a word is found early.
  function canMakeWord(word, boardCounts) {
    const need = {};
    for (const ch of word) {
      need[ch] = (need[ch] || 0) + 1;
      if (need[ch] > (boardCounts[ch] || 0)) return false;
    }
    return true;
  }

  function anyWordFindable(board, seedDict, minLen) {
    const boardCounts = {};
    for (const ch of board) boardCounts[ch] = (boardCounts[ch] || 0) + 1;
    for (let len = minLen; len <= MAX_WORD_LENGTH; len++) {
      const words = seedDict.byLength[len];
      if (!words) continue;
      for (let i = 0; i < words.length; i++) {
        if (canMakeWord(words[i], boardCounts)) return true;
      }
    }
    return false;
  }

  // ── Hint ─────────────────────────────────────────────────────────────────────
  // Finds a word (from seedDict, the small "simple" list) that the board's letters can still
  // make, preferring exactly minLen letters; if none of that exact length exist, tries minLen+1,
  // minLen+2, ... up to 10 (the longest a seed word can be). Returns null if no word of any
  // length from minLen to 10 can be made -- i.e. the same "nothing left" case anyWordFindable(
  // board, seedDict, minLen) would report as false. Deterministic: the first match in seedDict's
  // (alphabetical) order at the shortest workable length, so the same board+level always offers
  // the same hint.
  function findHintWord(board, seedDict, minLen, excludeWord = null, rng = Math.random) {
    const boardCounts = {};
    for (const ch of board) boardCounts[ch] = (boardCounts[ch] || 0) + 1;
    for (let len = minLen; len <= MAX_WORD_LENGTH; len++) {
      const words = seedDict.byLength[len];
      if (!words) continue;
      // Pick a random word, so we get variety in hints.
      const start = Math.floor(rng() * words.length);
      for (let k = 0; k < words.length; k++) {
        const w = words[(start + k) % words.length];
        if (w === excludeWord) continue;
        if (canMakeWord(w, boardCounts)) return w;
      }
    }
    return null;
  }

  // Given a hint word, returns the board indices to highlight: enough tiles to spell up to the first 4 letters,
  // taken from the board greedily by scanning the board once per needed letter. Each board
  // index is used for at most one letter of the hint, so it never claims the same tile twice even
  // if the word repeats a letter the board also happens to repeat.
  function hintTiles(board, word) {
    const halfLen = Math.min(4, Math.floor(word.length / 2));
    const used = new Set();
    const indices = [];
    for (let i = 0; i < halfLen; i++) {
      const ch = word[i];
      const idx = board.findIndex((c, j) => c === ch && !used.has(j));
      if (idx === -1) throw new Error('hintTiles: board cannot supply "' + word + '" (letter ' + ch + ' at position ' + i + ')');
      used.add(idx);
      indices.push(idx);
    }
    return indices;
  }

  // ═══ Storage (same pattern as SumStack: one key for the game, one for the best score) ═══
  const KEY_STATE = 'wordtiles_gamestate';
  const KEY_BEST  = 'wordtiles_highscore';

  function getBest() { return parseInt(localStorage.getItem(KEY_BEST) || '0', 10) || 0; }
  function saveBest(n) { localStorage.setItem(KEY_BEST, String(n)); }

  function saveGameState() {
    if (state.gameOver) localStorage.removeItem(KEY_STATE);
    else localStorage.setItem(KEY_STATE, JSON.stringify(state));
  }

  // Accept a saved game only if it is structurally sound; otherwise start fresh rather than crash.
  function loadGameState() {
    const saved = localStorage.getItem(KEY_STATE);
    if (!saved) return null;
    try {
      const s = JSON.parse(saved);
      const okBoard = Array.isArray(s.board) && s.board.length === CELLS && s.board.every(c => /^[A-Z]$/.test(c));
      const okBank = Array.isArray(s.bank) && s.bank.every(c => /^[A-Z]$/.test(c));
      // score may be negative (hints cost points and can take it below zero), but words never is.
      const okNums = Number.isInteger(s.score) && Number.isInteger(s.words) && s.words >= 0;
      const okSel = Array.isArray(s.selection) && s.selection.every(i => Number.isInteger(i) && i >= 0 && i < CELLS);
      const okHint = (s.hintWord === undefined || s.hintWord === null || typeof s.hintWord === 'string') &&
        (s.hintTiles === undefined || s.hintTiles === null ||
         (Array.isArray(s.hintTiles) && s.hintTiles.every(i => Number.isInteger(i) && i >= 0 && i < CELLS)));
      if (okBoard && okBank && okNums && okSel && okHint) {
        s.gameOver = false;
        if (s.hintWord === undefined) s.hintWord = null;
        if (s.hintTiles === undefined) s.hintTiles = null;
        return s;
      }
    } catch (e) { console.error(e); }
    return null;
  }

  // ═══ State & rendering ═══
  let seedDict = null;             // small "simple" word list; supplies letters for the grid
  let validDict = null;            // large "full" word list; decides what may be submitted
  let state = null;
  let freshCells = new Set();      // board indices to animate on the next render
  let wordFontBase = 32;           // px; set by applyLayout()

  // Sets `str` in textEl at basePx, then shrinks the font until it fits inside wrapEl.
  // Returns the font size used. Letter-spacing is in em, so proportions are preserved.
  function fitInto(textEl, wrapEl, str, basePx) {
    textEl.textContent = str;
    textEl.style.fontSize = basePx + 'px';
    const avail = wrapEl.clientWidth - 24;
    let w = textEl.getBoundingClientRect().width;
    if (w <= avail) return basePx;
    let size = Math.floor(basePx * avail / w);
    textEl.style.fontSize = size + 'px';
    while (size > 6 && textEl.getBoundingClientRect().width > avail) {
      size--;
      textEl.style.fontSize = size + 'px';
    }
    return size;
  }

  function render() {
    document.getElementById('score').textContent = state.score;
    document.getElementById('level').textContent = levelFor(state.words);
    document.getElementById('highscore').textContent = getBest();

    const valid = isValidWord(state, validDict);
    const hasSel = state.selection.length > 0;

    // Word display
    const wrap = document.getElementById('word-wrap');
    const text = document.getElementById('word-text');
    wrap.classList.toggle('valid', valid);
    wrap.classList.toggle('building', hasSel && !valid);
    if (hasSel) {
      text.className = 'word-text';
      const minLen = minSubmitFor(levelFor(state.words));
      const word = selectedWord(state);
      const blanksNeeded = Math.max(0, minLen - word.length);
      const display = blanksNeeded > 0 ? word + Array(blanksNeeded).fill('_').join('') : word; // .join(' ')
      fitInto(text, wrap, display, wordFontBase);
    } else {
      text.className = 'word-text word-placeholder';
      const minLen = minSubmitFor(levelFor(state.words));
      fitInto(text, wrap, 'Make a ' + minLen + '+ letter word', Math.round(wordFontBase * 0.5));
    }

    // Board
    const boardEl = document.getElementById('board');
    boardEl.classList.toggle('word-ready', valid);
    boardEl.innerHTML = '';
    for (let i = 0; i < CELLS; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const tile = document.createElement('div');
      tile.className = 'tile' + (state.selection.includes(i) ? ' selected' : '') + (freshCells.has(i) ? ' fresh' : '');
      const ltr = document.createElement('span');
      ltr.className = 'ltr';
      ltr.textContent = state.board[i];
      const pts = document.createElement('span');
      pts.className = 'pts';
      pts.textContent = LETTER_VALUES[state.board[i]];
      tile.appendChild(ltr);
      tile.appendChild(pts);
      fastTap(tile, function () { onTileTap(i); });
      cell.appendChild(tile);
      boardEl.appendChild(cell);
    }
    freshCells = new Set();

    document.getElementById('btn-confirm').disabled = !valid;
    document.getElementById('btn-back').setAttribute('aria-disabled', hasSel ? 'false' : 'true');

    const hintBtn = document.getElementById('btn-hint');
    hintBtn.textContent = state.hintWord ? ('Hint = ' + hintRevealText(state.hintWord)) : 'Hint';
  }

  // The portion of the hint word shown on the button and highlighted on the board: the first
  // floor(length / 2) letters (a 5-letter word reveals 2, matching hintTiles()).
  function hintRevealText(word) {
    return word.slice(0, Math.min(MAX_HINT_LENGTH, Math.floor(word.length / 2)));
  }

  // ═══ Interactions ═══
  function onTileTap(i) {
    if (state.gameOver) return;
    // Tiles can only be added by tapping them; a tile already in the word ignores the tap.
    // (Nothing changed, so there is nothing to save or redraw.)
    if (!selectTile(state, i)) return;
    saveGameState();
    render();
  }

  // Backspace button. Tap = delete the last letter; press and hold = clear the whole word.
  // These are the ONLY ways to take letters back out of the word.
  const HOLD_MS = 700;   // how long to hold before the whole word is cleared

  function onBackspaceTap() {
    if (state.gameOver) return;
    if (!backspace(state)) return;
    saveGameState();
    render();
  }

  function onBackspaceHold() {
    if (state.gameOver) return;
    if (!clearSelection(state)) return;
    saveGameState();
    render();
  }

  // Pointer events cover mouse and touch with one code path, and (unlike touchend + click)
  // there is no synthesised follow-up click to guard against, so a tap fires exactly once.
  function setupBackspace(btn) {
    let timer = null;
    let pressed = false;      // a press that started on this button is still in progress
    let holdFired = false;    // the hold already cleared the word, so ignore the release

    function cancelTimer() { if (timer !== null) { clearTimeout(timer); timer = null; } }
    function endPress() { cancelTimer(); pressed = false; }

    // Is the finger/pointer on (or within a small slop of) the button?
    function isOnButton(e) {
      const r = btn.getBoundingClientRect();
      const slop = 16;
      return e.clientX >= r.left - slop && e.clientX <= r.right + slop &&
             e.clientY >= r.top - slop && e.clientY <= r.bottom + slop;
    }

    btn.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;   // primary button only
      pressed = true;
      holdFired = false;
      cancelTimer();
      timer = setTimeout(function () {
        timer = null;
        if (!pressed) return;
        holdFired = true;
        onBackspaceHold();
      }, HOLD_MS);
    });

    btn.addEventListener('pointerup', function (e) {
      const wasPressed = pressed, fired = holdFired;
      endPress();
      if (!wasPressed || fired) return;        // not our press, or the hold already did the work
      if (!isOnButton(e)) return;              // slid away before lifting: treat as cancelled
      onBackspaceTap();
    });

    // Sliding clear of the button abandons the press; a few pixels of drift (a trembling finger)
    // is tolerated. touch-action: none (see CSS) stops the browser cancelling the press for us
    // when the finger drifts, so this check is what decides.
    btn.addEventListener('pointermove', function (e) {
      if (pressed && !isOnButton(e)) endPress();
    });

    btn.addEventListener('pointercancel', endPress);
    btn.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') endPress(); });
    // Stop Android's long-press context menu / text selection from competing with the hold.
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  function onSubmit() {
    if (state.gameOver) return;
    const cellsUsed = state.selection.slice();
    const word = selectedWord(state);
    const wordsBefore = state.words;
    const points = submitWord(state, seedDict, validDict);
    if (points === 0) return;
    // The hint is for finding ONE word; once any word is submitted (whether it used the hinted
    // tiles or not), the hint is spent and the button reverts to "Hint".
    state.hintWord = null;
    state.hintTiles = null;
    const levelUp = levelUpMessage(wordsBefore, state.words);   // null unless this word crossed a level

    cellsUsed.forEach(i => freshCells.add(i));

    // Best score is updated live, as in SumStack.
    if (state.score > getBest()) saveBest(state.score);

    saveGameState();
    render();
    showToast(word + '  +' + points);
    // Shown last, so the board behind the dialog is already up to date and the level is saved.
    if (levelUp) showLevelUp(levelUp);
  }

  function onFinish() {
    if (state.gameOver) return;
    const minLen = minSubmitFor(levelFor(state.words));
    const stillFindable = anyWordFindable(state.board, seedDict, minLen);
    const message = stillFindable
      ? 'There are still words to be found!\n\nAre you sure you want to finish this game with a score of ' + state.score + '?'
      : 'Finish this game with a score of ' + state.score + '?';
    if (!confirm(message)) return;
    finishGame();
  }

  function finishGame() {
    const finalScore = state.score;
    const previousBest = getBest();
    const isNewBest = finalScore > previousBest;
    if (isNewBest) saveBest(finalScore);

    state.gameOver = true;
    saveGameState();                       // removes the saved game

    document.getElementById('go-score').textContent = finalScore;
    document.getElementById('go-newbest').classList.toggle('hidden', !isNewBest);
    document.getElementById('go-best').textContent = 'Best: ' + getBest();
    document.getElementById('gameover').classList.remove('hidden');
  }

  function startNewGame() {
    state = newState(seedDict);
    state.gameOver = false;
    state.hintWord = null;   // like gameOver, this is page-level flow state, not part of logic.js
    state.hintTiles = null;
    freshCells = new Set(state.board.map((_, i) => i));
    document.getElementById('gameover').classList.add('hidden');
    saveGameState();
    render();
  }

  // ═══ Level-up dialog ═══
  // OK is ignored for the first LEVELUP_ARM_MS after the dialog appears. The dialog opens in
  // response to a tap on Submit; on a touch screen that same tap can still deliver a follow-up
  // "click" a moment later, and if it landed on OK it would dismiss the dialog before it was
  // ever seen. Nobody can read the message and press OK in half a second, so nothing is lost.
  const LEVELUP_ARM_MS = 500;
  let levelUpShownAt = 0;

  function showLevelUp(message) {
    document.getElementById('levelup-msg').textContent = message;
    document.getElementById('levelup').classList.remove('hidden');
    levelUpShownAt = Date.now();
    document.getElementById('btn-levelup').focus({ preventScroll: true });
  }

  function dismissLevelUp() {
    if (Date.now() - levelUpShownAt < LEVELUP_ARM_MS) return;
    document.getElementById('levelup').classList.add('hidden');
  }

  // ═══ Hint ═══
  // Page-level game-flow constant (not part of the shared logic.js module): how many points a
  // NEW hint word costs. Declared here, outside the embedded-logic block above, so re-embedding
  // test/logic.js into this file can never silently remove it again.
  const HINT_COST = 50;

  // Pressing Hint always asks first via the confirm dialog, whether or not a hint is already
  // active:
  //   - No existing hint: Yes finds a word and charges 50 points; No does nothing (as before).
  //   - A hint IS already active: Yes finds a DIFFERENT word (never the one currently shown) and
  //     charges another 50 points; No just re-displays the current hint's tiles for free,
  //     discarding whatever the player had tapped since -- the previous "press again" behaviour,
  //     now reached via No instead of happening immediately on tap.
  // isRefreshingHint (set when the dialog opens, read when it resolves) is what tells Yes/No
  // which of these two situations they are resolving.
  //
  // The same arming-delay trick as the level-up dialog is used for the two new dialogs below,
  // since they are also opened by a tap (on Hint) that could deliver a delayed synthetic click.
  const HINTCONFIRM_ARM_MS = 500;
  const NOHINT_ARM_MS = 500;
  let hintConfirmShownAt = 0;
  let nohintShownAt = 0;
  let pendingHintWord = null;   // the word found while the confirm dialog is open, not yet paid for
  let isRefreshingHint = false; // true if this confirm dialog is for a SECOND hint, replacing an active one

  function onHint() {
    if (state.gameOver) return;

    isRefreshingHint = !!state.hintWord;
    if (isRefreshingHint) {
      // Defensive: if the active hint's word is no longer actually on the board (should not
      // happen in normal play -- nothing changes the board while this hint is active except a
      // submit, which clears the hint -- but a corrupted or hand-edited save is possible), treat
      // this as a fresh request rather than risk a No that re-selects tiles that no longer spell
      // anything sensible.
      const boardCounts = {};
      for (const ch of state.board) boardCounts[ch] = (boardCounts[ch] || 0) + 1;
      if (!canMakeWord(state.hintWord, boardCounts)) {
        state.hintWord = null;
        state.hintTiles = null;
        isRefreshingHint = false;
      }
    }

    const minLen = minSubmitFor(levelFor(state.words));
    // When refreshing, the word currently on display must never be offered again as the "new"
    // hint -- that would not be a different hint at all.
    const word = findHintWord(state.board, seedDict, minLen, isRefreshingHint ? state.hintWord : null);
    // console.log('hint word:', word);
    if (!word) {
      // No (different) word exists. If a hint was already showing, leave it exactly as it is --
      // the dialog is purely informational here, there is nothing to confirm or decline.
      showNoHint();
      return;
    }
    pendingHintWord = word;
    showHintConfirm();
  }

  function showHintConfirm() {
    document.getElementById('hintconfirm').classList.remove('hidden');
    hintConfirmShownAt = Date.now();
  }

  function cancelHintConfirm() {
    if (Date.now() - hintConfirmShownAt < HINTCONFIRM_ARM_MS) return;
    document.getElementById('hintconfirm').classList.add('hidden');
    if (isRefreshingHint) {
      // No: keep the existing hint, just re-show its tiles for free (the old "press again"
      // behaviour), discarding whatever the player had tapped since.
      state.selection = state.hintTiles.slice();
      saveGameState();
      render();
    }
    pendingHintWord = null;
  }

  function acceptHintConfirm() {
    if (Date.now() - hintConfirmShownAt < HINTCONFIRM_ARM_MS) return;
    document.getElementById('hintconfirm').classList.add('hidden');
    if (!pendingHintWord) return;   // defensive: confirm dialog somehow accepted with nothing pending

    state.score -= HINT_COST;                       // score can go negative; nothing clamps it
    state.hintWord = pendingHintWord;
    state.hintTiles = hintTiles(state.board, pendingHintWord);
    state.selection = state.hintTiles.slice();
    pendingHintWord = null;

    saveGameState();
    render();
  }

  function showNoHint() {
    document.getElementById('nohint').classList.remove('hidden');
    nohintShownAt = Date.now();
  }

  function dismissNoHint() {
    if (Date.now() - nohintShownAt < NOHINT_ARM_MS) return;
    document.getElementById('nohint').classList.add('hidden');
  }

  // ═══ Toast & tap handling (same as SumStack) ═══
  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1600);
  }

  // touchend fires immediately (no 300ms delay); click is the desktop/browser fallback.
  // A touch also synthesises a click, so ignore a click that follows a touch on the same element.
  function fastTap(el, fn) {
    let touched = false;
    el.addEventListener('touchend', function (e) {
      e.preventDefault();
      touched = true;
      fn(e);
    }, { passive: false });
    el.addEventListener('click', function (e) {
      if (touched) { touched = false; return; }
      fn(e);
    });
  }

  setupBackspace(document.getElementById('btn-back'));
  fastTap(document.getElementById('btn-confirm'), onSubmit);
  fastTap(document.getElementById('btn-finish'), onFinish);
  fastTap(document.getElementById('btn-hint'), onHint);
  // Plain click, not fastTap, for the same reason as btn-levelup above.
  document.getElementById('btn-hintconfirm-yes').addEventListener('click', acceptHintConfirm);
  document.getElementById('btn-hintconfirm-no').addEventListener('click', cancelHintConfirm);
  document.getElementById('btn-nohint').addEventListener('click', dismissNoHint);
  fastTap(document.getElementById('btn-gameover'), startNewGame);
  // Plain click, not fastTap: it is delivered once, to OK itself, so closing the dialog can
  // never let a leftover tap fall through onto a tile underneath.
  document.getElementById('btn-levelup').addEventListener('click', dismissLevelUp);
  fastTap(document.getElementById('btn-new-game-hud'), function () {
    if (state && confirm('Start a new game?')) startNewGame();
  });

  // ═══ Layout (same approach as SumStack: size everything from the viewport width) ═══
  function applyLayout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const gap = Math.max(MAX_HINT_LENGTH, Math.min(12, Math.round(vw * 0.012)));

    // Fixed vertical furniture, in units of tileSize: title + HUD + word bar + action row +
    // finish button + paddings. Solve for the largest tile that fits BOTH the width and the
    // height, so the grid grows to fill a tablet but never overflows a small phone.
    const widthLimit  = Math.floor((vw * 0.94 - 20 - gap * 4) / 5);
    const heightLimit = Math.floor((vh - 20 - gap * 4 - 32) / (5 + 3.6));   // 5 tile rows + ~3.6 rows of furniture
    const tileSize = Math.max(52, Math.min(150, widthLimit, heightLimit));

    const root = document.documentElement;
    root.style.setProperty('--tile-size', tileSize + 'px');
    root.style.setProperty('--gap', gap + 'px');
    root.style.setProperty('--font-tile', Math.max(24, Math.round(tileSize * 0.53)) + 'px');
    root.style.setProperty('--font-ui', Math.max(14, Math.round(tileSize * 0.24)) + 'px');
    root.style.setProperty('--font-btn', Math.max(18, Math.round(tileSize * 0.26)) + 'px');
    root.style.setProperty('--btn-pad', Math.max(14, Math.round(tileSize * 0.2)) + 'px ' + Math.max(20, Math.round(tileSize * 0.28)) + 'px');
    root.style.setProperty('--font-label', Math.max(11, Math.round(tileSize * 0.15)) + 'px');
    wordFontBase = Math.max(26, Math.round(tileSize * 0.46));
    root.style.setProperty('--font-word', wordFontBase + 'px');
    root.style.setProperty('--font-pts', Math.max(11, Math.round(tileSize * 0.22)) + 'px');
    root.style.setProperty('--word-height', Math.max(56, Math.round(tileSize * 0.9)) + 'px');
  }

  // ═══ Boot ═══
  // Two word lists: the small "simple" list seeds the grid, the much larger "full" list
  // decides what the player may submit (see MainActivity.WordBridge on the Android side).
  function loadWordList(bridgeMethod, fileName) {
    // Android bridge. In a desktop browser there is no bridge, so fall back to fetching
    // the file next to this page for easy testing.
    if (window.Android && typeof window.Android[bridgeMethod] === 'function') {
      return Promise.resolve(window.Android[bridgeMethod]());
    }
    return fetch(fileName).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    });
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { if (state && seedDict && validDict) render(); });
  }

  function showFatal(msg) {
    document.body.insertAdjacentHTML('beforeend', '<div class="status-msg error">' + msg + '</div>');
  }

  applyLayout();
  window.addEventListener('resize', function () { applyLayout(); if (state) render(); });

  Promise.all([
    loadWordList('getWordList', 'simple_words_10.txt'),
    loadWordList('getFullWordList', 'CSW19.txt'),
  ]).then(function (results) {
    seedDict = buildDictionary(results[0]);
    validDict = buildDictionary(results[1], false);   // no byLength needed for validation-only
    if (seedDict.set.size < 1000) throw new Error('seed word list looks empty (' + seedDict.set.size + ' words)');
    if (validDict.set.size < 1000) throw new Error('validation word list looks empty (' + validDict.set.size + ' words)');

    const saved = loadGameState();
    if (saved) { state = saved; render(); }
    else startNewGame();
  }).catch(function (e) {
    console.error(e);
    showFatal('Could not load the word list.<br>' + String(e.message || e));
  });
</script>
</body>
</html>
